name: ci

# Required checks for pull requests to main. Terraform plans need repository
# variables and a same-repository PR; forks get an explicit notice instead of a
# green check that never planned.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run contract tests
        run: pnpm test:contract

  templates:
    name: Template validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate templates
        run: pnpm template:validate

      # Full history keeps origin/main available for the identity comparison.
      - name: Check template identities against main
        run: pnpm template:check --base origin/main

  integration:
    name: LocalStack integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        image: localstack/localstack:4
        env:
          SERVICES: sqs,s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests against LocalStack
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          SQS_ENDPOINT_URL: http://localhost:4566
          AWS_ENDPOINT_URL_S3: http://s3.localhost.localstack.cloud:4566
          AWS_REGION: eu-central-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: pnpm test:integration

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config="$GITHUB_WORKSPACE/tflint.hcl"

      - name: Run TFLint
        run: tflint --config="$GITHUB_WORKSPACE/tflint.hcl" --chdir=infra --call-module-type=all

  terraform-plan:
    name: Terraform plan
    needs:
      - terraform
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS credentials with the read-only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: printer-plan-${{ github.run_id }}

      - name: Initialize the S3 backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::The TF_STATE_BUCKET repository variable is required for the Terraform plan."
            exit 1
          fi
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY:-printer/terraform.tfstate}" \
            -backend-config="region=${TF_REGION}"

      - name: Materialize Terraform variables
        env:
          TF_VARS: ${{ vars.TF_VARS }}
        run: |
          set -euo pipefail
          if [ -n "${TF_VARS:-}" ]; then
            printf '%s\n' "${TF_VARS}" > infra/terraform.tfvars
          else
            echo "::notice::TF_VARS is not set; the plan uses Terraform defaults for operator configuration."
          fi

      # The read-only plan role cannot write the S3 native lock file, so the
      # plan runs without locking.
      - name: Plan Terraform
        env:
          TF_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          args=(-input=false -lock=false -out=plan.out)
          if [ -f infra/terraform.tfvars ]; then
            args+=(-var-file=terraform.tfvars)
          fi
          args+=(-var "region=${TF_REGION}")
          terraform -chdir=infra plan "${args[@]}"

      - name: Render plan summary
        run: |
          set -euo pipefail
          terraform -chdir=infra show -no-color plan.out > plan.txt
          {
            echo "### Terraform plan"
            echo
            grep -E '^(Plan:|No changes|Error:)' plan.txt || true
            echo
            echo "<details><summary>Resource changes</summary>"
            echo
            echo '```'
            grep -E '^  # ' plan.txt | head -n 100 || true
            echo '```'
            echo
            echo "</details>"
          } > plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the plan comment
        uses: actions/github-script@v7
        env:
          PLAN_SUMMARY_PATH: ${{ github.workspace }}/plan-summary.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            const summary = fs.readFileSync(process.env.PLAN_SUMMARY_PATH, "utf8");
            const body = `${marker}\n${summary}`.slice(0, 60000);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload the plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/plan.out
            plan-summary.md
          retention-days: 7

  terraform-plan-skipped:
    name: Terraform plan (skipped)
    needs:
      - terraform
    if: >-
      vars.AWS_PLAN_ROLE_ARN == '' ||
      vars.AWS_REGION == '' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain why the plan did not run
        env:
          PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
          PLAN_AWS_REGION: ${{ vars.AWS_REGION }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          reasons=()
          if [ -z "${PLAN_ROLE_ARN}" ]; then
            reasons+=("the AWS_PLAN_ROLE_ARN repository variable is not set")
          fi
          if [ -z "${PLAN_AWS_REGION}" ]; then
            reasons+=("the AWS_REGION repository variable is not set")
          fi
          if [ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
            reasons+=("the pull request comes from a fork (${HEAD_REPOSITORY})")
          fi
          reason_text=$(printf '%s; ' "${reasons[@]}")
          reason_text=${reason_text%; }
          message="Terraform plan skipped: ${reason_text}. No AWS plan was produced."
          echo "::notice title=Terraform plan skipped::${message}"
          {
            echo "### Terraform plan skipped"
            echo
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"

  commitlint:
    name: Commit conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint every pull request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose

      - name: Validate the pull request title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
